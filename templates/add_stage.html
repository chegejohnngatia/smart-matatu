{% extends "base.html" %}

{% block title %}Add Stage{% endblock %}

{% block content %}

    <h1>SMART MATATU</h1>

    <h2>Add Route Stage</h2>


<form method="POST">

    <label>Route:</label>
    <br>

    <input
        type="text"
        name="route_name"
        placeholder="e.g. Nairobi - Thika"
        required
    >

    <br><br>

    <label>Stage Name:</label>
    <br>

    <input
        type="text"
        name="name"
        placeholder="e.g. Pangani"
        required
    >

    <br><br>

    <label>Stage Order:</label>
    <br>

    <input
        type="number"
        name="sequence_number"
        placeholder="e.g. 1"
        min="1"
        required
    >

    <br><br>

    <label>Latitude:</label>
    <br>

    <input
        type="number"
        step="any"
        name="latitude"
        placeholder="e.g. -1.286389"
        required
    >

    <br><br>

    <label>Longitude:</label>
    <br>

    <input
        type="number"
        step="any"
        name="longitude"
        placeholder="e.g. 36.817223"
        required
    >

     <br><br>


    <button type="submit">
            Add Stage
    </button>

    </form>

    <br>

    <a href="/stages">
        View Stages
    </a>

    <br><br>

    <a href="/">
        Back to Dashboard
    </a>

{% endblock %}
