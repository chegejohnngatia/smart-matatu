{% extends "base.html" %}

{% block title %}Add Matatu{% endblock %}

{% block content %}

    <h1>SMART MATATU</h1>

    <h2>Register Matatu</h2>

    <form method="POST">

        <label>Registration Number:</label>
        <br>

        <input
            type="text"
            name="registration_number"
            placeholder="e.g. KCA 123A"
            required
        >

        <br><br>

        <label>Route:</label>
        <br>

        <input
            type="text"
            name="route_name"
            placeholder="e.g. Nairobi - Thika"
            required
        >

        <br><br>

        <button type="submit">
            Add Matatu
        </button>

    </form>

    <br>

    <a href="/">Back to Dashboard</a>

{% endblock %}
