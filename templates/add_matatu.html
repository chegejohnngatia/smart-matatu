<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Matatu</title>
</head>

<body>

    <h1>SMART MATATU</h1>

    <h2>Register Matatu</h2>

    <form method="POST">

        <label>Registration Number:</label>
        <br>

        <input
            type="text"
            name="registration_number"
            placeholder="e.g. KCA 123A"
            required
        >

        <br><br>

        <label>Route:</label>
        <br>

        <input
            type="text"
            name="route_name"
            placeholder="e.g. Nairobi - Thika"
            required
        >

        <br><br>

        <button type="submit">
            Add Matatu
        </button>

    </form>

    <br>

    <a href="/">Back to Dashboard</a>

</body>

</html>
